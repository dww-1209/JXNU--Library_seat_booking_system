[project]
name = "chaoxing-seat-reserver"
version = "0.1.0"
description = "Chaoxing library intelligent seat reservation workbench and automation engine"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "playwright==1.64.1",
    "python-docx==1.2.0",
    "python-pptx==1.0.2",
    "pillow==13.0.0",
    "lxml==6.1.3",
    "greenlet==3.5.6",
    "fastapi>=0.165.0",
    "uvicorn[standard]>=0.54.0",
    "pydantic-settings>=2.16.3",
    "httpx>=0.28.1",
    "loguru>=0.8.0",
    "pywebview>=6.2.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.6",
]
